name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      monorepo:
        description: Build against the forge monorepo checked out here (forge); empty = vars.FORGE_MONOREPO
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A compile the shared sccache server cannot serve falls back to a local one
  # instead of failing; 'failed to fill whole buffer' and 'Connection reset by
  # peer' were reds on code that compiled (CI-15; forge-agent ci 41877780255,
  # forge-control-plane ci 41877780278, forge-portal-e2e 41877780323).
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # One sccache server per runner, not one per box (MR-4). sccache starts its
      # server from whichever job compiles first, so the server is that job's child
      # and the runner's end-of-job cleanup kills it. With one port for the box, a
      # job that finished took every other job's compiles with it: run 41949500202
      # went red in the second run 41949505192's cleanup killed the server.
      - name: This runner's own sccache server
        run: |
          n="${RUNNER_NAME##*-}"
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          echo "SCCACHE_SERVER_PORT=$((4300 + n))" >> "$GITHUB_ENV"
      - name: Checkout forge-cli
        uses: actions/checkout@v4
        with:
          path: forge-cli

      # The harness ref this repo is pinned to (.harness/lock.json), so the
      # action and siblings.json always come from the same roll.
      - name: Read the harness pin
        id: harness
        run: echo "ref=$(python3 -c 'import json;print(json.load(open("forge-cli/.harness/lock.json"))["source"]["sha"])')" >> "$GITHUB_OUTPUT"
      - name: Checkout harness machinery (pinned)
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdlc-harness
          path: forge-sdlc-harness
          ref: ${{ steps.harness.outputs.ref }}
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      - name: Check out the sibling closure (.harness/siblings.json)
        uses: ./forge-sdlc-harness/.github/actions/checkout-siblings
        with:
          consumer: forge-cli
          keep: forge-sdlc-harness
          # BE-50: the forge monorepo switch. Set (org var FORGE_MONOREPO, or
          # this dispatch's input), the core repos come from one checkout of
          # forge-run/forge, linked at their names; empty, one clone each.
          monorepo: ${{ github.event.inputs.monorepo || vars.FORGE_MONOREPO }}
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      # The Java dialect's front half parses with `javac --release 21`
      # (forge-lang-java src/parse.rs), and the dialect tests run it.
      # ubuntu-latest defaults to an older JDK; pin the one the dialect needs.
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge-cli
          cache-on-failure: true

      - name: Fmt check
        working-directory: forge-cli
        run: cargo fmt --package forge-cli -- --check

      - name: Clippy (all warnings are errors)
        working-directory: forge-cli
        run: cargo clippy --package forge-cli --tests --locked -- -D warnings

      - name: Build
        working-directory: forge-cli
        run: cargo build --tests --locked

      - name: Test
        working-directory: forge-cli
        run: cargo test --package forge-cli --tests --no-fail-fast --locked

name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout forge-cli
        uses: actions/checkout@v4
        with:
          path: forge-cli

      # forge-cli's `new` command embeds forge-sdk's templates via
      # include_str! at `../../../forge-sdk/...`, so the SDK source
      # must be checked out as a sibling at compile time. Same PAT
      # setup as forge-runtime / forge-control-plane.
      - name: Checkout forge-sdk
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdk
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-sdk

      # forge-cli has a `forge-schema = { path = "../forge-schema" }` dep —
      # the schema crate must be checked out as a sibling or the build/test
      # can't resolve it (this is why CI + release were both red).
      - name: Checkout forge-schema
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-schema
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-schema

      # forge-cli has a `forge-manifest = { path = "../forge-types/crates/forge-manifest" }`
      # dep (the shared manifest-assembly crate), so forge-types must be checked
      # out as a sibling too or the build/test can't resolve the path.
      - name: Checkout forge-types
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-types
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-types

      # forge-web-build = { path = "../forge-web/build" } — the workspace
      # compiler (`forge wasm-build` graph + lock stamping). Needs forge-web as
      # a sibling; forge-web/build in turn path-deps forge-ui (../../forge-ui).
      - name: Checkout forge-web
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-web
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-web

      - name: Checkout forge-ui
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-ui
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-ui

      # forge-web/core path-deps forge-sdk-v2 (../../forge-sdk-v2). `cargo fmt
      # --all` / `cargo clippy` resolve forge-web's whole workspace graph, so
      # this sibling must be present too (the narrower release BUILD doesn't
      # pull core, which is why release.yml omits it).
      - name: Checkout forge-sdk-v2
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdk-v2
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-sdk-v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge-cli
          cache-on-failure: true

      - name: Fmt check
        working-directory: forge-cli
        run: cargo fmt --all -- --check

      - name: Clippy (all warnings are errors)
        working-directory: forge-cli
        run: cargo clippy --tests --locked -- -D warnings

      - name: Build
        working-directory: forge-cli
        run: cargo build --tests --locked

      - name: Test
        working-directory: forge-cli
        run: cargo test --tests --no-fail-fast --locked

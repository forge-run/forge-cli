name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout forge-cli
        uses: actions/checkout@v4
        with:
          path: forge-cli

      # The harness ref this repo is pinned to (.harness/lock.json), so the
      # action and siblings.json always come from the same roll.
      - name: Read the harness pin
        id: harness
        run: echo "ref=$(python3 -c 'import json;print(json.load(open("forge-cli/.harness/lock.json"))["source"]["sha"])')" >> "$GITHUB_OUTPUT"
      - name: Checkout harness machinery (pinned)
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdlc-harness
          path: forge-sdlc-harness
          ref: ${{ steps.harness.outputs.ref }}
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      - name: Check out the sibling closure (.harness/siblings.json)
        uses: ./forge-sdlc-harness/.github/actions/checkout-siblings
        with:
          consumer: forge-cli
          keep: forge-sdlc-harness
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      # The Java dialect's front half parses with `javac --release 21`
      # (forge-lang-java src/parse.rs), and the dialect tests run it.
      # ubuntu-latest defaults to an older JDK; pin the one the dialect needs.
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge-cli
          cache-on-failure: true

      - name: Fmt check
        working-directory: forge-cli
        run: cargo fmt --package forge-cli -- --check

      - name: Clippy (all warnings are errors)
        working-directory: forge-cli
        run: cargo clippy --package forge-cli --tests --locked -- -D warnings

      - name: Build
        working-directory: forge-cli
        run: cargo build --tests --locked

      - name: Test
        working-directory: forge-cli
        run: cargo test --package forge-cli --tests --no-fail-fast --locked

name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout forge-cli
        uses: actions/checkout@v4
        with:
          path: forge-cli

      # forge-cli has a `forge-schema = { path = "../forge-schema" }` dep —
      # the schema crate must be checked out as a sibling or the build/test
      # can't resolve it (this is why CI + release were both red).
      - name: Checkout forge-schema
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-schema
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-schema

      # forge-cli has a `forge-manifest = { path = "../forge-types/crates/forge-manifest" }`
      # dep (the shared manifest-assembly crate), so forge-types must be checked
      # out as a sibling too or the build/test can't resolve the path.
      - name: Checkout forge-types
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-types
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-types

      # forge-web-build = { path = "../forge-web/build" } — the workspace
      # compiler (`forge wasm-build` graph + lock stamping). Needs forge-web as
      # a sibling; forge-web/build in turn path-deps forge-ui (../../forge-ui).
      - name: Checkout forge-web
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-web
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-web

      - name: Checkout forge-ui
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-ui
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-ui

      # forge-web/core path-deps forge-sdk-v2 (../../forge-sdk-v2). `cargo fmt
      # --all` / `cargo clippy` resolve forge-web's whole workspace graph, so
      # this sibling must be present too (the narrower release BUILD doesn't
      # pull core, which is why release.yml omits it).
      - name: Checkout forge-sdk-v2
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdk-v2
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-sdk-v2

      # forge-cli path-deps ../forge-lang/crates/forge-lang-rustgen (Cargo.toml
      # :73, added with `forge check` / `forge wasm-build`). Cargo loads every
      # path dep's manifest before it looks at features or targets, so WITHOUT
      # this checkout the FIRST cargo command in the job dies on a missing
      # manifest — clippy — and Build and Test are skipped, which is how a red
      # main looks green-adjacent. That happened on every forge-cli push from
      # 2026-08-28 09:57 until this step landed.
      #
      # forge-lang in turn path-deps forge-sdk-v2 (whose own path dep is
      # forge-schema); both are already checked out above, which is why this
      # one step is enough. The set is measured, not guessed — see
      # forge-lang/.harness/consumer.yaml's `ci.sibling_checkouts`, which also
      # names forge-runtime, needed only for forge-lang's own wasm e2e bindgen
      # and not for anything forge-cli compiles.
      - name: Checkout forge-lang
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-lang
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
          path: forge-lang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge-cli
          cache-on-failure: true

      - name: Fmt check
        working-directory: forge-cli
        run: cargo fmt --package forge-cli -- --check

      - name: Clippy (all warnings are errors)
        working-directory: forge-cli
        run: cargo clippy --package forge-cli --tests --locked -- -D warnings

      - name: Build
        working-directory: forge-cli
        run: cargo build --tests --locked

      - name: Test
        working-directory: forge-cli
        run: cargo test --package forge-cli --tests --no-fail-fast --locked

# generated by forge-sdlc-harness (harness build); do not edit — edits are drift
name: harness-gates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Diff base for the sweep (ref); empty = HEAD~1
        required: false
        default: ""
jobs:
  gates:
    runs-on: [self-hosted]
    # The shared runner resolves its consumer from this, not from where the
    # runner file happens to live — it now lives in the harness checkout.
    env:
      HARNESS_CONSUMER_ROOT: ${{ github.workspace }}/forge-cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: forge-cli
      - name: Checkout harness machinery (3dfde9e)
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdlc-harness
          path: forge-sdlc-harness
          ref: 3dfde9e010028e4db5a105ba13529692b1926bbb
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      - name: Checkout forge-sdk-v2
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-sdk-v2
          path: forge-sdk-v2
          ref: main
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      - name: Checkout forge-schema
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-schema
          path: forge-schema
          ref: main
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      - name: Checkout forge-runtime
        uses: actions/checkout@v4
        with:
          repository: forge-run/forge-runtime
          path: forge-runtime
          ref: main
          clean: true
          token: ${{ secrets.FORGE_CROSS_REPO_TOKEN }}
      # Some runners' service PATH lacks ~/.cargo/bin (per-runner skew
      # on the shared box); make resolution uniform before the action.
      - name: Put cargo home on PATH (+ self-heal shared rustup)
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # The shared rustup can be left mid-race damaged (binary gone,
          # shims dangling). Repair under a lock so concurrent jobs
          # serialize into ONE installer instead of racing (2026-08-08).
          if ! [ -x "$HOME/.cargo/bin/rustup" ]; then
            flock /tmp/rustup-repair.lock -c 'test -x "$HOME/.cargo/bin/rustup" || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --no-modify-path'
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      # No rust-cache: the self-hosted runners persist target/ between
      # runs already, and rust-cache's post-job pruning corrupted a
      # sibling workflow's persistent target dir (missing dep-info, cargo
      # 101) when it ran against the shared workspace root.
      - name: Emitted artifacts match the lockfile (drift gate)
        working-directory: forge-cli
        run: python3 "$GITHUB_WORKSPACE/forge-sdlc-harness/core/runner/runner.py" self-check
      - name: Run harness gates (structural twin of session gates)
        working-directory: forge-cli
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.inputs.base }}"; fi
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          python3 "$GITHUB_WORKSPACE/forge-sdlc-harness/core/runner/runner.py" all --diff-base "$BASE"
      # LLM verifiers: dormant until the ANTHROPIC_API_KEY org secret
      # exists — adding it is the only activation step (D-013/D-017).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pre-review verifiers (secret-gated)
        working-directory: forge-cli
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not configured — verifiers skipped (add the org secret to activate)"
            exit 0
          fi
          command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.inputs.base }}"; fi
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"; fi
          python3 "$GITHUB_WORKSPACE/forge-sdlc-harness/core/runner/runner.py" pre-review --diff-base "$BASE"
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: forge-cli/.harness/evidence/
      - name: Trigger forge-run/forge-portal-e2e (portal-push)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sf -X POST -H "Authorization: token ${{ secrets.FORGE_CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/forge-run/forge-portal-e2e/dispatches \
            -d '{"event_type": "portal-push"}'

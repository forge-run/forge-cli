# forge-cli is a Rust CLI with no HTML surface — the portal silent-catch
# scan is declared not applicable.
overrides:
  no-silent-catch:
    params:
      roots: ""
  # templates/*/ are scaffold crates copied out by `forge new`, not workspace
  # members. At the pinned harness the tiered cargo-tests focus walks a
  # changed template file up to its own [package] Cargo.toml and runs
  # `-p forge-template-echo`, which cargo cannot resolve. forge-cli is a
  # single-package repo, so the full run costs the same — always run full.
  # (main@dee34ce falls back to full on its own; drop this at the next roll.)
  cargo-tests:
    params:
      scope: full
# The CI sibling floor (CI-2). This list REPLACES the hybrid manifest's, so it
# repeats that list in its order and the cargo closure is added after it.
ci:
  sibling_checkouts:
    - forge-sdk-v2
    - forge-schema
    # build.rs reads ../forge-runtime/crates/forge-runtime-auth/schemas at
    # build time to embed the runtime-owned schema bundle. No Cargo.toml here
    # path-deps forge-runtime, so the cargo closure cannot see this read:
    # without the declaration the build panics "cannot read the runtime-owned
    # schema bundle".
    - forge-runtime
    # the fact-pins gate reads forge-facts beside the consumer
    - forge-facts

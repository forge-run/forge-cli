[package]
name = "forge-cli"
version = "0.2.5"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Customer-facing CLI for the Forge platform — talks to a workspace's forge-runtime over HTTPS."
repository = "https://github.com/forge-run/forge-cli"
homepage = "https://app.forge.run"
readme = "README.md"
keywords = ["forge", "cli", "device-flow", "wasm", "workspace"]
categories = ["command-line-utilities"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
base64 = "0.22.1"
# Wrap the wasm32-wasip1 cdylib as a Component-Model artifact
# before deploy. forge-runtime W3 cutover (2026-05-15) made the
# runtime reject core modules — only Components instantiate. The
# adapter blob ships inside the provider crate's `artefacts/` dir.
# Versions pinned to the major forge-runtime uses (see its
# Cargo.lock).
wit-component = "0.236"
wasi-preview1-component-adapter-provider = "37.0.3"
# Open the device-flow verification URL in the operator's default
# browser. Cross-platform; failures (no DISPLAY, no default
# browser) fall back to the printed-URL-and-code UX.
webbrowser = "1"
# `forge update` self-update: download a newer release from GH,
# verify sha256, atomic-swap the running binary in place. Rustls
# backend matches the rest of the CLI's TLS story (no system
# OpenSSL dep). `compression-flate2` decodes the .tar.gz tarballs
# the release workflow produces.
self_update = { version = "0.42", default-features = false, features = ["rustls", "compression-flate2", "archive-tar"] }

[dev-dependencies]
tempfile = "3"
# Compile WAT (WebAssembly text format) to bytes inside the
# wasm-validator tests; same crate forge-runtime's tests use.
wat = "1"
